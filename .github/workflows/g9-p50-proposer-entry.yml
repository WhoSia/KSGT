name: G9-P50 Proposer Entry Contract CI

on:
  push:
    paths:
      - "experiments/g9-p50/proposer-entry/**"
      - "experiments/g9-p50/source_conditioned_entry_court.json"
      - ".github/workflows/g9-p50-proposer-entry.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install TypeScript compiler
        run: npm install --no-save --ignore-scripts typescript@5.8.3
      - name: Type-check and compile
        run: npx tsc -p experiments/g9-p50/proposer-entry/tsconfig.json
      - name: Execute admission-invariant tests
        run: node --test experiments/g9-p50/proposer-entry/tests/entry.test.cjs
