name: G9-P47 Canonical Result Collector

on:
  workflow_run:
    workflows: ["G9-P47 Frozen Representation Court"]
    types: [completed]

permissions:
  contents: read
  actions: read

jobs:
  collect:
    if: ${{ github.event.workflow_run.id == 37389716969 }}
    runs-on: ubuntu-latest
    steps:
      - name: Download F0
        uses: actions/download-artifact@v4
        with:
          name: g9-p47-F0-okhc
          path: results
          run-id: 37389716969
          github-token: ${{ github.token }}
      - name: Download F1
        uses: actions/download-artifact@v4
        with:
          name: g9-p47-F1-okhc
          path: results
          run-id: 37389716969
          github-token: ${{ github.token }}
      - name: Download F2
        uses: actions/download-artifact@v4
        with:
          name: g9-p47-F2-okhc
          path: results
          run-id: 37389716969
          github-token: ${{ github.token }}
      - name: Download F3
        uses: actions/download-artifact@v4
        with:
          name: g9-p47-F3-okhc
          path: results
          run-id: 37389716969
          github-token: ${{ github.token }}
      - name: Print canonical model receipts
        run: |
          for f in results/g9_p47_*_okhc.json; do
            echo "===== $f ====="
            cat "$f"
          done
      - name: Build combined result
        run: |
          python - <<'PY'
          import glob,json
          xs={}
          for p in sorted(glob.glob("results/g9_p47_*_okhc.json")):
              d=json.load(open(p,encoding="utf-8"))
              xs[d["alias"]]=d
          json.dump({"schema":"ksgt.g9.p47.canonical-frozen-matrix.v1","canonical_run_id":37389716969,"models":xs},
                    open("g9_p47_canonical_frozen_matrix.json","w",encoding="utf-8"),ensure_ascii=False,indent=2)
          PY
      - name: Upload canonical matrix
        uses: actions/upload-artifact@v4
        with:
          name: g9-p47-canonical-frozen-matrix
          path: g9_p47_canonical_frozen_matrix.json
          if-no-files-found: error
          retention-days: 30
