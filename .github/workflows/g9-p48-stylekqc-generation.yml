name: G9-P48 StyleKQC Robustness Generation

on:
  push:
    paths:
      - "experiments/g9-p48/run_stylekqc_paraphrase_pilot.py"
      - ".github/workflows/g9-p48-stylekqc-generation.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pilot:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Compile fixed StyleKQC v1.1 packet
        run: python experiments/g9-p48/prepare_stylekqc_paraphrase_packet.py
      - name: Install frozen generator runtime
        run: python -m pip install "torch==2.6.0" "transformers==4.49.0" "huggingface-hub==0.29.1" "safetensors>=0.4.5"
      - name: Execute hidden-positive robustness pilot
        env:
          TOKENIZERS_PARALLELISM: "false"
        run: |
          python experiments/g9-p48/run_stylekqc_paraphrase_pilot.py \
            --source p48_stylekqc_source_packet.jsonl \
            --gold p48_stylekqc_hidden_gold.jsonl \
            --out g9_p48_stylekqc_generation_result.json
      - name: Delete ephemeral raw packets
        if: always()
        run: rm -f p48_stylekqc_source_packet.jsonl p48_stylekqc_hidden_gold.jsonl
      - uses: actions/upload-artifact@v4
        with:
          name: g9-p48-stylekqc-generation-result
          path: g9_p48_stylekqc_generation_result.json
          if-no-files-found: error
          retention-days: 30
