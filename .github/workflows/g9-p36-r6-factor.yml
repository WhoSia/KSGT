name: G9-P36-R6 obligation-factor quotient court
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['experiments/g9-p36-r6/action_trigger.txt']
permissions: {contents: write}
jobs:
  court:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - name: Verify presealed R6 factor constitution
        run: |
          set -euo pipefail
          test -f experiments/g9-p36-r6/preseal.yaml
          grep -q 'PROSPECTIVE_CHARTER_SEALED_BEFORE_R6_SCORING' experiments/g9-p36-r6/preseal.yaml
          mkdir -p experiments/g9-p36-r6/final /tmp/r6
          node experiments/g9-p36-r6/generate_r6_controls.mjs experiments/g9-p36-r6/final/r6_controls.json | tee experiments/g9-p36-r6/controls.log
      - name: Build unchanged inherited R3 proof kernel and controls
        run: |
          set -euo pipefail
          cargo build --release --manifest-path experiments/g9-p36-r3/proof-kernel/Cargo.toml
          cp experiments/g9-p36-r3/proof-kernel/target/release/g9_p36_r3_proof_kernel /tmp/proof-kernel
          node experiments/g9-p36-r3/generate_controls.mjs /tmp/r6/r3-controls.jsonl
          /tmp/proof-kernel /tmp/r6/r3-controls.jsonl experiments/g9-p36-r6/final/r3_control_proofs.jsonl
      - name: Resolve and verify inherited public source
        run: |
          set -euo pipefail
          BASE='https://tudatalib.ulb.tu-darmstadt.de/server/api'; ITEM='8d57be09-68f3-4d47-aed4-2e555cbcc503'
          curl -fsSL -H 'Accept: application/hal+json' "$BASE/core/items/$ITEM/bundles?size=100" -o /tmp/b.json
          BUNDLE=$(jq -r '._embedded.bundles[]|select(.name=="ORIGINAL")|.uuid' /tmp/b.json|head -1)
          curl -fsSL -H 'Accept: application/hal+json' "$BASE/core/bundles/$BUNDLE/bitstreams?size=100" -o /tmp/s.json
          CONTENT=$(jq -r '._embedded.bitstreams[]|select(.name=="Re3Align_v1.0.zip")|._links.content.href' /tmp/s.json|head -1)
          curl -fL --retry 4 --retry-delay 5 "$CONTENT" -o /tmp/Re3Align.zip
          test "$(sha256sum /tmp/Re3Align.zip|awk '{print $1}')" = d400a34d8dcf557c0e49b1d140db29a34153688a7047e451bba9635c5944519b
          mkdir /tmp/re3; unzip -q /tmp/Re3Align.zip -d /tmp/re3
      - name: Execute factor reuse and proof-carrying microfusion court
        run: |
          set -euo pipefail
          cp experiments/g9-p36-r2/adapter_response_chunk_v1.js /tmp/adapter.mjs
          cp experiments/g9-p36-r2/compiler_c3r2_structural.js /tmp/r2compiler.mjs
          node experiments/g9-p36-r6/extract_r6_factors.mjs /tmp/re3 /tmp/adapter.mjs /tmp/r2compiler.mjs experiments/g9-p36-r6/final | tee experiments/g9-p36-r6/extraction.log
          rustc -O experiments/g9-p36-r6/crosscheck_r6.rs -o /tmp/r6-crosscheck
          /tmp/r6-crosscheck experiments/g9-p36-r6/final/factor_postings.tsv | tee experiments/g9-p36-r6/final/rust_crosscheck.tsv
          JS_REUSE=$(jq -r '.factor_reuse.core_qualified_reuse_pairs' experiments/g9-p36-r6/final/extraction_summary.json)
          JS_MICRO=$(jq -r '.microfusion.microfusion_candidate_pairs' experiments/g9-p36-r6/final/extraction_summary.json)
          RS_REUSE=$(awk -F '\t' '$1=="reuse_pairs"{print $2}' experiments/g9-p36-r6/final/rust_crosscheck.tsv)
          RS_MICRO=$(awk -F '\t' '$1=="micro_candidates"{print $2}' experiments/g9-p36-r6/final/rust_crosscheck.tsv)
          test "$JS_REUSE" = "$RS_REUSE"
          test "$JS_MICRO" = "$RS_MICRO"
          /tmp/proof-kernel experiments/g9-p36-r6/final/candidates.jsonl experiments/g9-p36-r6/final/proof_objects.jsonl 2>&1 | tee experiments/g9-p36-r6/proof-kernel.log
          node experiments/g9-p36-r6/adjudicate_r6.mjs experiments/g9-p36-r6/final | tee experiments/g9-p36-r6/final-run.log
      - uses: actions/upload-artifact@v4
        with:
          name: g9-p36-r6-obligation-factor-court
          path: experiments/g9-p36-r6/
      - name: Commit derived R6 artifacts
        if: always()
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add experiments/g9-p36-r6/final experiments/g9-p36-r6/*.log || true
          git commit -m 'G9-P36-R6: materialize obligation-factor quotient court' || exit 0
          git pull --rebase origin main
          git push origin HEAD:main
