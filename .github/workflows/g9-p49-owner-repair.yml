name: G9-P49 Owner Repair Packet

on:
  push:
    paths:
      - ".github/workflows/g9-p49-owner-repair.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  owner-repair-packet:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install frozen runtime
        run: |
          python -m pip install \
            "torch==2.6.0" \
            "transformers==4.49.0"
      - name: Compile fresh disjoint owner sources
        run: python experiments/g9-p49/prepare_owner_repair_sources.py
      - name: Generate frozen A1/A3 blind repair packet
        env:
          TOKENIZERS_PARALLELISM: "false"
        run: |
          mkdir -p p49_owner_packet
          python experiments/g9-p49/run_owner_repair_generation.py \
            --source p49_owner_source_packet.jsonl \
            --refs p49_owner_hidden_refs.jsonl \
            --outdir p49_owner_packet
      - name: Print receipts only
        run: |
          python - <<'PY'
          import json
          a=json.load(open("g9_p49_owner_source_receipt.json",encoding="utf-8"))
          b=json.load(open("p49_owner_packet/g9_p49_owner_packet_receipt.json",encoding="utf-8"))
          print(json.dumps(a,ensure_ascii=False))
          print(json.dumps(b,ensure_ascii=False))
          PY
      - name: Upload private working packet
        uses: actions/upload-artifact@v4
        with:
          name: g9-p49-owner-repair-working-packet
          path: |
            p49_owner_packet/p49_owner_repair_pass1.jsonl
            p49_owner_packet/p49_owner_repair_pass2.jsonl
            p49_owner_packet/p49_owner_hidden_key.jsonl
            p49_owner_packet/g9_p49_owner_packet_receipt.json
            g9_p49_owner_source_receipt.json
          if-no-files-found: error
          retention-days: 1
