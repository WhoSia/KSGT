name: KSGT R9.39b Repair Feedback

on:
  push:
    branches: [research/r9-24-anchored-revision]
    paths: ['.github/workflows/ksgt-r939b-repair-feedback-groq.yml']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ksgt-r939b-repair-feedback-groq
  cancel-in-progress: false

jobs:
  repair-feedback:
    if: github.actor == 'WhoSia' && github.ref == 'refs/heads/research/r9-24-anchored-revision' && github.run_attempt == 1
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify fixed alternatives and discourse transitions
        run: |
          node --test experiments/discourse-state/*.test.cjs
          node experiments/discourse-state/repair-feedback.cjs --plan > "$RUNNER_TEMP/r939b-plan-safe.json"
      - name: Compare local repair with and without defect evidence
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: |
          node experiments/discourse-state/repair-feedback.cjs --execute "$RUNNER_TEMP/r939b-run"
      - name: Archive attempt markers, response receipts and token usage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ksgt-r939b-repair-feedback-groq
          retention-days: 7
          if-no-files-found: error
          path: |
            ${{ runner.temp }}/r939b-plan-safe.json
            ${{ runner.temp }}/r939b-run/
