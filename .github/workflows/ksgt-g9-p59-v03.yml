name: KSGT G9-P59 Synthetic Contracts v0.3-v0.9
on:
  workflow_dispatch:
  push:
    paths:
      - 'experiments/g9-p59/**'
      - '.github/workflows/ksgt-g9-p59-v03.yml'
permissions:
  contents: read
jobs:
  synthetic-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run reproducible contract tests
        run: |
          node experiments/g9-p59/reader_choice_probe.cjs > /dev/null
          node experiments/g9-p59/reader_state_v02.cjs > /dev/null
          node experiments/g9-p59/pipeline_v03.cjs
      - name: Typed reference critic and cross-language SQLite leakage audit
        run: |
          node experiments/g9-p59/semantic_critic_v04.cjs
          node experiments/g9-p59/semantic_critic_v04.cjs --emit-dataset | python3 experiments/g9-p59/split_audit_v04.py
      - name: V0.5 family split, same-packet models and independent SQLite audit
        run: |
          node experiments/g9-p59/dataset_v05.cjs
          node experiments/g9-p59/model_compare_v05.cjs
          node experiments/g9-p59/dataset_v05.cjs --emit | python3 experiments/g9-p59/leakage_audit_v05.py
      - name: V0.6 belief-state counterfactual invariance and theory oracle
        run: |
          node experiments/g9-p59/intervention_v06.cjs
          node experiments/g9-p59/intervention_bridge_v06.cjs
      - name: P59 internal v0.7 exact finite-state bound and independent noise audit
        run: |
          node experiments/g9-p59/memory_v07.cjs
          node experiments/g9-p59/memory_v07.cjs --emit-histories | python3 experiments/g9-p59/memory_audit_v07.py
          node experiments/g9-p59/delayed_query_v07.cjs
      - name: P59 internal v0.8 exact delayed-query rate-distortion bound
        run: |
          node experiments/g9-p59/rate_distortion_v08.cjs
      - name: P59 internal v0.9 source-grounded writing benchmark contract
        run: |
          node experiments/g9-p59/writing_benchmark_v09.cjs
          node experiments/g9-p59/evidence_order_v09.cjs
