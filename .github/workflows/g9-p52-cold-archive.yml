name: G9-P52 Retired Source Cold Archive

on:
  push:
    paths:
      - ".github/workflows/g9-p52-cold-archive.yml"

permissions:
  contents: read

jobs:
  archive:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Package source-only P52 frozen experiment
        env:
          SOURCE_COMMIT: ${{ github.sha }}
        run: |
          python - <<'PY'
          import hashlib,json,os,subprocess,zipfile
          from pathlib import Path
          files=sorted(p for p in subprocess.check_output(["git","ls-files","-z"]).decode().split("\0") if p and
            (p.startswith("experiments/g9-p52/") or p.startswith("artifacts/g9_p52_") or p.startswith(".github/workflows/g9-p52-")))
          if len(files)<8:raise RuntimeError("P52 source archive incomplete")
          if any(p.endswith((".gguf",".u16le",".bin")) for p in files):raise RuntimeError("Model/data bytes forbidden")
          m={"schema":"ksgt.g9.p52.cold-source.v1","commit":os.environ["SOURCE_COMMIT"],
             "scientific_verdict":"SPAN_INTERFACE_FAILURE_NO_GOVERNOR_CLAIM",
             "file_count":len(files),
             "files":[{"path":p,"bytes":Path(p).stat().st_size,"sha256":hashlib.sha256(Path(p).read_bytes()).hexdigest()} for p in files]}
          target="KSGT_G9-P52_RETIRED_SOURCE.zip"
          with zipfile.ZipFile(target,"w",compression=zipfile.ZIP_DEFLATED) as z:
            for p in files:z.write(p,p)
            z.writestr("ARCHIVE_MANIFEST.json",json.dumps(m,indent=2)+"\n")
          with zipfile.ZipFile(target) as z:
            for item in m["files"]:assert hashlib.sha256(z.read(item["path"])).hexdigest()==item["sha256"]
          receipt={"schema":"ksgt.g9.p52.cold-source-receipt.v1","source_commit":os.environ["SOURCE_COMMIT"],
             "file_count":len(files),"inner_zip_sha256":hashlib.sha256(Path(target).read_bytes()).hexdigest(),
             "model_weights_and_raw_candidates_included":False}
          Path("G9-P52_ARCHIVE_RECEIPT.json").write_text(json.dumps(receipt,indent=2)+"\n")
          print(json.dumps(receipt))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: g9-p52-retired-source
          path: |
            KSGT_G9-P52_RETIRED_SOURCE.zip
            G9-P52_ARCHIVE_RECEIPT.json
          if-no-files-found: error
          retention-days: 30
