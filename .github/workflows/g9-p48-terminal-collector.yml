name: G9-P48 Terminal Adjudication Collector

on:
  workflow_run:
    workflows: ["G9-P48 Candidate Budget Expansion"]
    types: [completed]

permissions:
  contents: read
  actions: read

jobs:
  adjudicate:
    if: ${{ github.event.workflow_run.id == 37435838070 && github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout latest adjudicator
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Download canonical candidate-budget receipts
        uses: actions/download-artifact@v4
        with:
          name: g9-p48-candidate-budget-receipts
          path: receipts
          run-id: 37435838070
          github-token: ${{ github.token }}
      - name: Apply presealed terminal rule
        run: |
          python experiments/g9-p48/adjudicate_candidate_budget_terminal.py \
            --packet receipts/g9_p48_kolla_budget_packet_receipt.json \
            --result receipts/g9_p48_candidate_budget_result.json \
            --out g9_p48_terminal_adjudication.json
      - name: Print terminal adjudication
        run: cat g9_p48_terminal_adjudication.json
      - name: Upload terminal receipt
        uses: actions/upload-artifact@v4
        with:
          name: g9-p48-terminal-adjudication
          path: g9_p48_terminal_adjudication.json
          if-no-files-found: error
          retention-days: 30
