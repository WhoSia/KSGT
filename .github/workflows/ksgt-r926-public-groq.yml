name: KSGT R9.26 Groq Public Revision Pilot

on:
  push:
    branches: [research/r9-24-anchored-revision]
    paths: ['.github/workflows/ksgt-r926-public-groq.yml']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ksgt-r926-public-groq
  cancel-in-progress: false

jobs:
  public-revision:
    if: github.actor == 'WhoSia' && github.ref == 'refs/heads/research/r9-24-anchored-revision' && github.run_attempt == 1
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify bounded input and revision regression
        run: |
          node --test experiments/g10-p1/r924_anchored_revision_v01.test.cjs experiments/g10-p1/r926_repeated_revision_v01.test.cjs
          node experiments/g10-p1/r926_repeated_revision_v01.cjs --plan-public > "$RUNNER_TEMP/r926-plan-safe.json"
      - name: Run two repeats across the three public authored probes
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: |
          node experiments/g10-p1/r926_repeated_revision_v01.cjs --execute-public "$RUNNER_TEMP/r926-run" "$RUNNER_TEMP/r926-summary.json"
      - name: Archive attempt markers, response receipts and token usage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ksgt-r926-public-groq
          retention-days: 7
          if-no-files-found: error
          path: |
            ${{ runner.temp }}/r926-plan-safe.json
            ${{ runner.temp }}/r926-summary.json
            ${{ runner.temp }}/r926-run/*.attempt.json
            ${{ runner.temp }}/r926-run/*.result.json
