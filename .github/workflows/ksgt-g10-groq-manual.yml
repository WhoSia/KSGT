name: KSGT G10-P1 Groq Prose Pilot (Manual)

on:
  workflow_dispatch:
    inputs:
      model:
        description: "Groq model ID (check GroqCloud Models for availability)"
        required: false
        type: string
        default: ""
      publish_outputs:
        description: "Upload raw Korean model outputs as GitHub artifact? May be accessible to repository readers; leave false by default"
        required: true
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: ksgt-groq-manual-${{ github.ref }}
  cancel-in-progress: false

jobs:
  groq_one_source:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      NODE_ENV: production
    steps:
      - name: Checkout read-only source
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Install Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Validate generation code locally, no network
        run: |
          node --test experiments/g10-p1/*.test.cjs
          node experiments/g10-p1/paired_runner_v02.cjs --dry-run \
            --input experiments/g10-p1/fixtures/groq_smoke_one_source.json > /dev/null

      - name: Check Groq repository secret is present
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: |
          if [ -z "$GROQ_API_KEY" ]; then
            echo "::error::Repository secret GROQ_API_KEY is missing. Go to Settings > Secrets and variables > Actions."
            exit 1
          fi
          echo "GROQ_API_KEY present (value not displayed)."

      - name: Run Groq five-arm single-source pilot
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GROQ_MODEL: ${{ inputs.model || vars.GROQ_MODEL || 'llama-3.3-70b-versatile' }}
          REPORT_PATH: ${{ runner.temp }}/ksgt-groq-pilot.json
        run: |
          node experiments/g10-p1/paired_runner_v02.cjs \
            --run --provider groq --model "$GROQ_MODEL" \
            --temperature 0.2 --max-tokens 850 --seed "groq-manual-001" \
            --input experiments/g10-p1/fixtures/groq_smoke_one_source.json \
            --output "$REPORT_PATH"

      - name: Publish safe run metadata (never text content)
        if: always()
        env:
          REPORT_PATH: ${{ runner.temp }}/ksgt-groq-pilot.json
        run: |
          if [ -f "$REPORT_PATH" ]; then
            node experiments/g10-p1/groq_actions_summary_v01.cjs "$REPORT_PATH" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "No model report was created; authentication, tests or runner may have failed." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Optional upload of generated Korean prose (explicit opt-in)
        if: ${{ inputs.publish_outputs }}
        uses: actions/upload-artifact@v4
        with:
          name: ksgt-groq-development-one-source
          path: ${{ runner.temp }}/ksgt-groq-pilot.json
          retention-days: 1
          if-no-files-found: error

# Manual only. No API calls on push, no writes to Git, no Actions bot commits.
# Do not enable publish_outputs for private or copyright-restricted source briefs.
