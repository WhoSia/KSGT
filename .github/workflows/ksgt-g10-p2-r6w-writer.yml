name: KSGT G10-P2 R6w source-budget factorial trial
on:
  push:
    branches: [research/g10-p2-reader-state-coupled]
    paths: [.github/workflows/ksgt-g10-p2-r6w-writer.yml]
permissions:
  contents: read
  actions: read
jobs:
  factorial:
    if: github.actor == 'WhoSia' && github.ref == 'refs/heads/research/g10-p2-reader-state-coupled' && github.run_attempt == 1
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 30
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify identity and exact frozen source
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          test "$(gh api "repos/$GITHUB_REPOSITORY/commits/$GITHUB_SHA" --jq .author.login)" = WhoSia
          test "$(gh api "repos/$GITHUB_REPOSITORY/commits/$GITHUB_SHA" --jq .committer.login)" = WhoSia
          if git log -20 --format='%an|%ae|%cn|%ce' | grep -i 'github-actions\[bot\]'; then exit 1; fi
          test "$(git hash-object experiments/g10-p2/r5/r6w_d19s_manifest.json)" = bf64fdfc1b76c318ff8e72282807279fc54784ea
          test "$(git hash-object experiments/g10-p2/r5/r6w_d19s_writer.cjs)" = 7b2f7628ee2b6570c4fb316555b3fef9708e7548
          test "$(git hash-object experiments/g10-p2/r5/r6w_d19s_writer.test.cjs)" = 33bbb54df8ac79c484f314c09e915e98e28cc08b
          node --test experiments/g10-p2/r5/r6w_d19s_writer.test.cjs
          node experiments/g10-p2/r5/r6w_d19s_writer.cjs --preflight > "$RUNNER_TEMP/r6w-preflight.json"
      - name: Forty-eight single-call development conditions
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: node experiments/g10-p2/r5/r6w_d19s_writer.cjs --execute "$RUNNER_TEMP/r6w-live"
      - name: Verify completed receipts
        run: node experiments/g10-p2/r5/r6w_d19s_writer.cjs --verify "$RUNNER_TEMP/r6w-live"
      - name: Preserve complete or partial receipts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ksgt-r6w-source-budget-receipts
          retention-days: 7
          if-no-files-found: warn
          path: |
            ${{ runner.temp }}/r6w-live/
            ${{ runner.temp }}/r6w-preflight.json
