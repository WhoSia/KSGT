name: G9-P48 StyleKQC Source Audit

on:
  push:
    paths:
      - "experiments/g9-p48/audit_stylekqc_source.py"
      - ".github/workflows/g9-p48-stylekqc-audit.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Audit exact StyleKQC source
        run: python experiments/g9-p48/audit_stylekqc_source.py
      - name: Upload receipt
        uses: actions/upload-artifact@v4
        with:
          name: g9-p48-stylekqc-source-audit
          path: g9_p48_stylekqc_source_audit.json
          if-no-files-found: error
          retention-days: 30
