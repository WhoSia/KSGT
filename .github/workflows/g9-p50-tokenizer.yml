name: G9-P50 Korean Tokenizer Materialization

on:
  push:
    paths:
      - "experiments/g9-p50/materialize_tokenizer.py"
      - "experiments/g9-p50/tokenizer_preseal.json"
      - "experiments/g9-p50/corpus_reservoir_preseal.json"
      - ".github/workflows/g9-p50-tokenizer.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tokenizer:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install tokenizer runtime
        run: |
          python -m pip install --upgrade pip
          python -m pip install "datasets==4.1.1" "sentencepiece==0.2.1" "huggingface_hub>=0.35,<1"

      - name: Materialize frozen tokenizer
        env:
          HF_HUB_DISABLE_TELEMETRY: "1"
        run: |
          python experiments/g9-p50/materialize_tokenizer.py \
            --target-chars 100000000 \
            --out-dir g9_p50_tokenizer_artifact

      - name: Verify no raw sample is packaged
        run: |
          test ! -e g9_p50_tokenizer_artifact/tokenizer_sample.txt
          python - <<'PY'
          import json
          from pathlib import Path
          p = Path("g9_p50_tokenizer_artifact/manifest.json")
          x = json.loads(p.read_text())
          assert x["raw_training_text_in_artifact"] is False
          assert x["raw_training_text_in_repo"] is False
          assert x["model_training_authorized_by_this_receipt"] is False
          assert x["tokenizer"]["piece_size"] > 32000
          print(json.dumps({
              "piece_size": x["tokenizer"]["piece_size"],
              "sample_docs": x["sample"]["documents"],
              "sample_chars": x["sample"]["realized_characters"],
              "tokens_per_eojeol": x["diagnostic"]["tokens_per_eojeol"],
              "byte_piece_fraction": x["diagnostic"]["byte_piece_fraction"],
              "unk_piece_count": x["diagnostic"]["unk_piece_count"],
              "model_sha256": x["tokenizer"]["model_sha256"],
          }, indent=2))
          PY

      - uses: actions/upload-artifact@v4
        with:
          name: g9-p50-korean-tokenizer
          path: g9_p50_tokenizer_artifact/
          if-no-files-found: error
          retention-days: 30
