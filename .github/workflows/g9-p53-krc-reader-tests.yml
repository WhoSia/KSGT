name: G9-P53 KRC Blind Reader Court Tests

on:
  push:
    paths:
      - "experiments/g9-p53/krc_v01/reader_forms.cjs"
      - "experiments/g9-p53/krc_v01/reader_tests/**"
      - "experiments/g9-p53/krc_v01/reader_court_protocol.json"
      - ".github/workflows/g9-p53-krc-reader-tests.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Test counterbalanced anonymous reader forms
        run: node --test experiments/g9-p53/krc_v01/reader_tests/*.test.cjs
