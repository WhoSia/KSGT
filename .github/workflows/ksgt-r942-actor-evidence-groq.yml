name: KSGT R9.42 Evidence-gated Actor Reference

on:
  push:
    branches: [research/r9-24-anchored-revision]
    paths: ['.github/workflows/ksgt-r942-actor-evidence-groq.yml']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ksgt-r942-actor-evidence-groq
  cancel-in-progress: false

jobs:
  actor-evidence:
    if: github.actor == 'WhoSia' && github.ref == 'refs/heads/research/r9-24-anchored-revision' && github.run_attempt == 1
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify actor evidence and existing discourse tests
        run: |
          node --test experiments/discourse-state/*.test.cjs
          node experiments/discourse-state/actor-evidence.cjs --plan > "$RUNNER_TEMP/r942-plan.json"
      - name: Compare raw text with annotated candidate inventory
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: |
          node experiments/discourse-state/actor-evidence.cjs --execute "$RUNNER_TEMP/r942-run"
      - name: Verify responses and emit lexical summaries
        run: |
          node experiments/discourse-state/actor-evidence.cjs --score "$RUNNER_TEMP/r942-run" > "$RUNNER_TEMP/r942-results.json"
          node -e 'const r=require(process.argv[1]);for(const arm of ["raw","candidate_inventory"]){const a=r.map(x=>x.model[arm]); console.log(arm,JSON.stringify({rows:a.length,names:a.filter(x=>x.namedLiteral).length,actions:a.filter(x=>x.actionLiteral).length,tokens:a.reduce((s,x)=>s+(x.tokens||0),0),perStage:r.map(x=>({stage:x.stage,named:x.model[arm].namedLiteral,action:x.model[arm].actionLiteral}))}))}' "$RUNNER_TEMP/r942-results.json"
      - name: Preserve attempt receipts and score outputs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ksgt-r942-actor-evidence-groq
          retention-days: 7
          if-no-files-found: error
          path: |
            ${{ runner.temp }}/r942-plan.json
            ${{ runner.temp }}/r942-run/
            ${{ runner.temp }}/r942-results.json
