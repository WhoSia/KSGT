name: KSGT R9.18 Primary Literature and Contextual Generator Custody
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/ksgt-r918-literature-custody.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  source-custody:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Test exact checked-out contextual realization source
        run: node --test experiments/g10-p1/r918_contextual_realizer.test.cjs experiments/g10-p1/r915_reader_first_harness.test.cjs
      - name: Seal exact authored source and primary-text audit; no third-party PDF included
        shell: bash
        run: |
          python - <<'PY'
          import pathlib,hashlib,zipfile,json,os
          root=pathlib.Path('experiments/g10-p1')
          names=['r918_contextual_realizer.cjs','r918_contextual_realizer.test.cjs','paper/R9_18_DRIVE_ORIGINALS_CONTEXTUAL_REALIZER_20261109.md']
          receipt={'schema':'ksgt.r918.git-exact-custody.v1','originalThirdPartyPDFsIncluded':False,'newProviderCalls':0,'trainingSteps':0,'files':[]}
          output=pathlib.Path(os.environ['RUNNER_TEMP'])/'KSGT_R918_GITHUB_EXACT_SOURCE.zip'
          with zipfile.ZipFile(output,'w',zipfile.ZIP_DEFLATED) as z:
            for name in names:
              path=root/name;data=path.read_bytes();receipt['files'].append({'path':str(path),'bytes':len(data),'sha256':hashlib.sha256(data).hexdigest()})
              z.writestr(str(path),data)
            z.writestr('R918_GITHUB_SHA256.json',json.dumps(receipt,ensure_ascii=False,indent=2)+'\n')
          with zipfile.ZipFile(output) as z:
            assert z.testzip() is None
            for f in receipt['files']:assert hashlib.sha256(z.read(f['path'])).hexdigest()==f['sha256']
          print(json.dumps({'files':len(names),'zip_sha256':hashlib.sha256(output.read_bytes()).hexdigest(),'bytes':output.stat().st_size}))
          PY
      - name: Preserve raw checkout source without CI authored commits
        uses: actions/upload-artifact@v4
        with:
          name: KSGT_R918_GITHUB_EXACT_SOURCE
          path: ${{ runner.temp }}/KSGT_R918_GITHUB_EXACT_SOURCE.zip
          retention-days: 7
