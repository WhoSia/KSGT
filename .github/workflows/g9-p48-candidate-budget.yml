name: G9-P48 Candidate Budget Expansion

on:
  push:
    paths:
      - ".github/workflows/g9-p48-candidate-budget.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  budget-expansion:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install frozen runtime
        run: |
          python -m pip install \
            "torch==2.6.0" \
            "transformers==4.49.0"
      - name: Compile fresh disjoint KoLLA packet
        run: python experiments/g9-p48/prepare_kolla_budget_packet.py
      - name: Run nested K intervention
        env:
          TOKENIZERS_PARALLELISM: "false"
        run: |
          python experiments/g9-p48/run_kolla_budget_expansion.py \
            --source p48_budget_source_packet.jsonl \
            --gold p48_budget_hidden_gold.jsonl \
            --out g9_p48_candidate_budget_result.json
      - name: Print receipts
        run: |
          cat g9_p48_kolla_budget_packet_receipt.json
          cat g9_p48_candidate_budget_result.json
      - name: Upload receipts only
        uses: actions/upload-artifact@v4
        with:
          name: g9-p48-candidate-budget-receipts
          path: |
            g9_p48_kolla_budget_packet_receipt.json
            g9_p48_candidate_budget_result.json
          if-no-files-found: error
          retention-days: 30
