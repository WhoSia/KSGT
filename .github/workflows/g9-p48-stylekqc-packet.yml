name: G9-P48 StyleKQC Robustness Packet

on:
  push:
    paths:
      - "experiments/g9-p48/prepare_stylekqc_paraphrase_packet.py"
      - ".github/workflows/g9-p48-stylekqc-packet.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  packet:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Compile hidden-positive robustness packet
        run: python experiments/g9-p48/prepare_stylekqc_paraphrase_packet.py
      - name: Delete ephemeral raw packets before artifact upload
        run: rm -f p48_stylekqc_source_packet.jsonl p48_stylekqc_hidden_gold.jsonl
      - uses: actions/upload-artifact@v4
        with:
          name: g9-p48-stylekqc-packet-receipt
          path: g9_p48_stylekqc_packet_receipt.json
          if-no-files-found: error
          retention-days: 30
