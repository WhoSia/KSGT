name: G9-P47 F1 Native Limit Sensitivity

on:
  push:
    paths:
      - ".github/workflows/g9-p47-f1-native128.yml"
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  f1-native128:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Download canonical frozen packet
        uses: actions/download-artifact@v4
        with:
          name: g9-p47-okhc-public-packet
          path: p47_packet
          run-id: 37389716969
          github-token: ${{ github.token }}
      - name: Install frozen runtime
        run: |
          python -m pip install \
            "torch==2.6.0" "transformers==4.49.0" "sentence-transformers==3.4.1" \
            "scikit-learn==1.6.1" "numpy==2.2.3" "huggingface-hub==0.29.1"
      - name: Run presealed F1 native-128 sensitivity
        env:
          TOKENIZERS_PARALLELISM: "false"
        run: |
          python experiments/g9-p47/run_f1_native128_sensitivity.py \
            --packet p47_packet/packet.jsonl --out g9_p47_F1_native128.json
      - uses: actions/upload-artifact@v4
        with:
          name: g9-p47-F1-native128
          path: g9_p47_F1_native128.json
          if-no-files-found: error
          retention-days: 30
