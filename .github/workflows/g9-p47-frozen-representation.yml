name: G9-P47 Frozen Representation Court

on:
  push:
    paths:
      - "experiments/g9-p47/**"
      - ".github/workflows/g9-p47-frozen-representation.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  prepare-public-okhc:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install packet dependency
        run: python -m pip install "requests==2.32.3"
      - name: Build exact public OKHC packet
        run: python experiments/g9-p47/prepare_okhc_public_packet.py --outdir p47_packet
      - name: Upload frozen packet
        uses: actions/upload-artifact@v4
        with:
          name: g9-p47-okhc-public-packet
          path: |
            p47_packet/packet.jsonl
            p47_packet/prep_receipt.json
          if-no-files-found: error
          retention-days: 30

  frozen-encoder:
    needs: prepare-public-okhc
    strategy:
      fail-fast: false
      matrix:
        alias: [F0, F1, F2, F3]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Download frozen packet
        uses: actions/download-artifact@v4
        with:
          name: g9-p47-okhc-public-packet
          path: p47_packet
      - name: Install frozen runtime
        run: |
          python -m pip install \
            "torch==2.6.0" \
            "transformers==4.49.0" \
            "sentence-transformers==3.4.1" \
            "scikit-learn==1.6.1" \
            "numpy==2.2.3" \
            "huggingface-hub==0.29.1"
      - name: Run frozen encoder court
        env:
          TOKENIZERS_PARALLELISM: "false"
        run: |
          python experiments/g9-p47/run_frozen_encoder.py \
            --alias "${{ matrix.alias }}" \
            --packet p47_packet/packet.jsonl \
            --out "g9_p47_${{ matrix.alias }}_okhc.json"
      - name: Upload model receipt
        uses: actions/upload-artifact@v4
        with:
          name: g9-p47-${{ matrix.alias }}-okhc
          path: "g9_p47_${{ matrix.alias }}_okhc.json"
          if-no-files-found: error
          retention-days: 30
