name: G9-P48 KoLLA v2 Source Audit

on:
  push:
    paths:
      - "experiments/g9-p48/audit_kolla_v2.py"
      - ".github/workflows/g9-p48-kolla-audit.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Audit canonical KoLLA v2 M2
        run: python experiments/g9-p48/audit_kolla_v2.py
      - uses: actions/upload-artifact@v4
        with:
          name: g9-p48-kolla-v2-source-audit
          path: g9_p48_kolla_v2_source_audit.json
          if-no-files-found: error
          retention-days: 30
