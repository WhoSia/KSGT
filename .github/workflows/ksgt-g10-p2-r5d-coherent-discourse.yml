name: KSGT G10-P2 R5d Coherent Korean Discourse Seam Experiment
on:
  push:
    branches: [research/g10-p2-reader-state-coupled]
    paths: ['.github/workflows/ksgt-g10-p2-r5d-coherent-discourse.yml']
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: ksgt-g10-p2-r5d-four-new-120b-20261121
  cancel-in-progress: false

jobs:
  real-korean-seam-generation:
    if: github.actor == 'WhoSia' && github.ref == 'refs/heads/research/g10-p2-reader-state-coupled' && github.run_attempt == 1
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      NODE_OPTIONS: --unhandled-rejections=strict
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 50
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Human Git contributor only and read-only actions
        shell: bash
        run: |
          test "$(git log -1 --format='%ae')" = '71053804+WhoSia@users.noreply.github.com'
          if git log -40 --format='%an|%ae|%cn|%ce' | grep -i 'github-actions\[bot\]'; then
            echo BOT_CONTRIBUTION_ZERO_VIOLATION; exit 1
          fi
      - name: Native R5 / P2 regression tests
        run: |
          node --test experiments/g10-p2/r5/*.test.cjs
          node --test experiments/g10-p2/*.test.cjs
      - name: Cold fetch and verify both historic raw artifacts before any new model call
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p "$RUNNER_TEMP/old-r5b" "$RUNNER_TEMP/old-r5c"
          gh run download 44899223057 --repo "$GITHUB_REPOSITORY" --name ksgt-g10-p2-r5b-korean-realizer-20b120b-24realcalls --dir "$RUNNER_TEMP/old-r5b"
          gh run download 44900323773 --repo "$GITHUB_REPOSITORY" --name ksgt-g10-p2-r5c-16-real-120b-edits-and-rewrites --dir "$RUNNER_TEMP/old-r5c"
          test -s "$RUNNER_TEMP/old-r5b/r5b-live/responses/R5A_NOTICE_BOOK_B120.result.json"
          test -s "$RUNNER_TEMP/old-r5c/r5c-live/final-score.json"
          node experiments/g10-p2/r5/r5d_coherent_seam_realizer.cjs --preflight "$RUNNER_TEMP/old-r5b" > "$RUNNER_TEMP/r5d-frozen-preflight.json"
          test -s "$RUNNER_TEMP/r5d-frozen-preflight.json"
          node -e 'let x=require(process.argv[1]);if(x.calls!==4||x.previousB120Originals!==4||x.works.length!==4)process.exit(1);console.log("R5d-preflight",x.planHash)' "$RUNNER_TEMP/r5d-frozen-preflight.json"
      - name: Actually generate four bounded coherent Korean discourse rewrites with 120B
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: |
          node experiments/g10-p2/r5/r5d_coherent_seam_realizer.cjs --execute "$RUNNER_TEMP/r5d-live" "$RUNNER_TEMP/old-r5b" "$RUNNER_TEMP/old-r5c"
      - name: Cold score final Korean prose and verify independent authority remains zero
        run: |
          node experiments/g10-p2/r5/r5d_coherent_seam_realizer.cjs --score "$RUNNER_TEMP/r5d-live" "$RUNNER_TEMP/old-r5b" "$RUNNER_TEMP/old-r5c" > "$RUNNER_TEMP/r5d-cold-recount.json"
          node -e 'let x=require(process.argv[1]);if(x.newProviderCalls!==4||x.comparableWholeTexts!==16||x.actualIndependentNativeReaderVotes!==0||x.confirmedProseQualitySuperiority!=="NONE")process.exit(1);console.log("R5d-results",JSON.stringify(x))' "$RUNNER_TEMP/r5d-cold-recount.json"
          test "$(grep -c '^### 원고 A' "$RUNNER_TEMP/r5d-live/plain-Korean-fourway-prose.md")" -eq 4
      - name: Preserve model bytes and plain Korean four-way reading packet for Drive
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ksgt-g10-p2-r5d-four-120b-coherent-seam-rewrites
          retention-days: 7
          if-no-files-found: warn
          path: |
            ${{ runner.temp }}/r5d-frozen-preflight.json
            ${{ runner.temp }}/r5d-live/
            ${{ runner.temp }}/r5d-cold-recount.json
