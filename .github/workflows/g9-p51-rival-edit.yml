name: G9-P51 Bounded RIVAL_EDIT Instrument

on:
  push:
    paths:
      - "experiments/g9-p51/rival_edit_preseal.json"
      - "experiments/g9-p51/rival_edit.cjs"
      - "experiments/g9-p51/tests/rival_edit.test.cjs"
      - ".github/workflows/g9-p51-rival-edit.yml"
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  court:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Run synthetic pre-outcome tests
        run: node --test experiments/g9-p51/tests/rival_edit.test.cjs
      - name: Retrieve immutable P50 source-only PIA packet
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p frozen-packet
          gh run download 37576195589 \
            --repo "${{ github.repository }}" \
            --name g9-p50-pia-source-packet \
            --dir frozen-packet
          test -f frozen-packet/p50_pia_source_packet.jsonl
      - name: Execute one bounded RIVAL_EDIT candidate attempt
        run: |
          mkdir -p results
          node experiments/g9-p51/rival_edit.cjs \
            frozen-packet/p50_pia_source_packet.jsonl \
            results/g9_p51_rival_edit_entry_receipt.json
      - name: Verify no raw sources or candidates were persisted
        run: |
          node - <<'JS'
          const fs=require('node:fs');
          const r=JSON.parse(fs.readFileSync('results/g9_p51_rival_edit_entry_receipt.json'));
          if(r.source_item_count!==24||r.candidates_generated!==96||r.pia_adjudication!=='NOT_PERFORMED')throw Error('INVALID_RECEIPT');
          const entries=r.per_item_opaque_receipts;
          if(entries.length!==24||entries.some(x=>x.candidate_sha256.length!==4||x.candidate_count!==4||'source' in x||'candidate' in x||'text' in x))throw Error('RAW_OUTPUT_LEAK_OR_BAD_COUNTS');
          if(r.governor_u_vs_k!=='BLOCKED_NO_PIA_PASS'||r.no_raw_sources_candidates_or_hidden_refs_in_receipt!==true)throw Error('AUTHORITY_LEAK');
          console.log(JSON.stringify({status:r.numerical_entry_precondition,n:r.source_item_count,nonidentity:r.candidate0_nonidentity,pia:r.pia_adjudication,governor:r.governor_u_vs_k}));
          JS
      - uses: actions/upload-artifact@v4
        with:
          name: g9-p51-rival-edit-mechanical-receipt
          path: results/g9_p51_rival_edit_entry_receipt.json
          if-no-files-found: error
          retention-days: 30
