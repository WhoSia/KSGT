name: KSGT Pre-P51 Historical Source Cold Archive

on:
  push:
    paths:
      - ".github/workflows/g9-p51-history-cold-archive.yml"

permissions:
  contents: read

jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Create verified tracked-source cold snapshot
        env:
          SOURCE_COMMIT: ${{ github.sha }}
        run: |
          python - <<'PY'
          import hashlib, json, os, subprocess, zipfile
          from pathlib import Path
          tracked=sorted(p for p in subprocess.check_output(["git","ls-files","-z"]).decode().split("\0") if p)
          if len(tracked)<450:
              raise RuntimeError("Abnormal repository inventory; refusing incomplete archive")
          archive_name="KSGT_PRE_P51_FULL_TRACKED_SOURCE_SNAPSHOT.zip"
          hfiles=[]
          with zipfile.ZipFile(archive_name,"w",compression=zipfile.ZIP_DEFLATED,compresslevel=6,allowZip64=True) as z:
              for path in tracked:
                  # stream hash separately so 58 MB source files never need whole-file RAM
                  dig=hashlib.sha256()
                  with open(path,"rb") as f:
                      while True:
                          b=f.read(4*1024*1024)
                          if not b:break
                          dig.update(b)
                  hfiles.append({"path":path,"size":Path(path).stat().st_size,"sha256":dig.hexdigest()})
                  z.write(path,path)
              manifest={"schema":"ksgt.pre-p51.full-repo-tracked-source.v1",
                  "source_repo":"WhoSia/KSGT",
                  "source_commit":os.environ["SOURCE_COMMIT"],
                  "file_count":len(tracked),
                  "scope":"EXACT_TRACKED_MAIN_TREE_SOURCE_ONLY",
                  "excluded":"Git history objects, external Actions artifacts (including 100M-token stream), external Drive corpora",
                  "files":hfiles}
              z.writestr("COLD_ARCHIVE_MANIFEST.json",json.dumps(manifest,ensure_ascii=False,indent=2)+"\n")
          with zipfile.ZipFile(archive_name) as z:
              assert len(z.namelist())==len(tracked)+1
              m=json.loads(z.read("COLD_ARCHIVE_MANIFEST.json"))
              assert m["source_commit"]==os.environ["SOURCE_COMMIT"]
              assert all(z.getinfo(item["path"]).file_size==item["size"] for item in m["files"])
          sha=hashlib.sha256()
          with open(archive_name,"rb") as f:
              for part in iter(lambda:f.read(4*1024*1024),b""):
                  sha.update(part)
          receipt={"schema":"ksgt.pre-p51.cold-archive-receipt.v1",
              "source_commit":os.environ["SOURCE_COMMIT"],
              "archive_name":archive_name,
              "file_count":len(tracked),
              "archive_sha256":sha.hexdigest(),
              "archive_bytes":Path(archive_name).stat().st_size,
              "manifest_included":True,
              "external_tokens_excluded":True}
          Path("KSGT_PRE_P51_COLD_ARCHIVE_RECEIPT.json").write_text(json.dumps(receipt,indent=2)+"\n")
          print(json.dumps(receipt,indent=2),flush=True)
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: ksgt-pre-p51-full-repository-cold-source
          path: |
            KSGT_PRE_P51_FULL_TRACKED_SOURCE_SNAPSHOT.zip
            KSGT_PRE_P51_COLD_ARCHIVE_RECEIPT.json
          if-no-files-found: error
          retention-days: 30
