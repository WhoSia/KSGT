name: G9-P36-R10-R1 real-schema ontology regression
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['experiments/g9-p36-r10-r1/action_trigger.txt']
permissions: {contents: read}
jobs:
  court:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Verify retrospective boundary
        run: grep -q 'RETROSPECTIVE_RAW_INTAKE_AND_ONTOLOGY_CENSUS_ON_USER_SUPPLIED_BYTES' experiments/g9-p36-r10-r1/status.yaml
      - name: Build canonical Rust ARG core
        run: cargo build --release --manifest-path experiments/g9-p36-r10/arg-core-rs/Cargo.toml
      - name: Generate real-schema fixtures
        run: python experiments/g9-p36-r10-r1/generate_real_schema_fixtures_r1.py /tmp/r1-fixtures
      - name: Adapt real-schema fixtures
        run: |
          set -euo pipefail
          python experiments/g9-p36-r10-r1/nikl_real_adapter_r1.py             2020=/tmp/r1-fixtures/actual2020.json             2025=/tmp/r1-fixtures/actual2025.json             --out /tmp/r1-adapt
          python - <<'PY'
          import json
          x=json.load(open('/tmp/r1-adapt/adapter_summary.json'))
          assert x['records']==5
          assert x['syntactic_slot_counts']=={'SUBJECT':2,'OBJECT':2,'UNKNOWN':1}
          assert x['recovery_counts']=={'ZERO_ANAPHORIC':2,'ZERO_GENERIC_OR_EXOPHORIC':1,'ZERO_DEICTIC':1,'UNSATURATED_UNKNOWN':1}
          PY
      - name: Validate with canonical Rust core
        run: |
          set -euo pipefail
          experiments/g9-p36-r10/arg-core-rs/target/release/ksgt_arg_r10             batch /tmp/r1-adapt/arg_validate_requests.jsonl /tmp/r1-adapt/arg_validation_receipts.jsonl
          python - <<'PY'
          import json
          xs=[json.loads(x) for x in open('/tmp/r1-adapt/arg_validation_receipts.jsonl') if x.strip()]
          assert len(xs)==5 and all(x['pass'] and x['match_expected'] for x in xs)
          json.dump({'pass':True,'records':5,'real_schema_adapter':'R1','rust_core':'KSGT-ARG-v1'},open('/tmp/r1-adapt/regression_receipt.json','w'),indent=2)
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: g9-p36-r10-r1-real-schema-regression
          path: /tmp/r1-adapt/
