name: KSGT G10-P2 R6h scope-process Korean writer
on:
  push:
    branches: [research/g10-p2-reader-state-coupled]
    paths: [.github/workflows/ksgt-g10-p2-r6h-scope-writer.yml]
permissions:
  contents: read
  actions: read
concurrency:
  group: ksgt-g10-p2-r6h-12-20261127
  cancel-in-progress: false
jobs:
  matched-writer:
    if: github.actor == 'WhoSia' && github.ref == 'refs/heads/research/g10-p2-reader-state-coupled' && github.run_attempt == 1
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 45
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Human contributor provenance and frozen plan
        shell: bash
        run: |
          test "$(git log -1 --format='%ae')" = '71053804+WhoSia@users.noreply.github.com'
          if git log -40 --format='%an|%ae|%cn|%ce' | grep -i 'github-actions\[bot\]'; then exit 1; fi
          node --test experiments/g10-p2/r5/r6h_scope_writer.test.cjs
          node experiments/g10-p2/r5/r6h_scope_writer.cjs --preflight > "$RUNNER_TEMP/r6h-preflight.json"
          node -e 'const p=require(process.argv[1]);if(p.works!==6||p.calls!==12||p.planSHA!=="aef24392b67e4f788648852999c2fbbb6199e7b5e3c0f4da1bc2227abf948568")process.exit(1)' "$RUNNER_TEMP/r6h-preflight.json"
      - name: Twelve bounded synthetic-source provider requests
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: node experiments/g10-p2/r5/r6h_scope_writer.cjs --execute "$RUNNER_TEMP/r6h-live"
      - name: Verify complete outputs and source-bound receipts
        run: node experiments/g10-p2/r5/r6h_scope_writer.cjs --verify "$RUNNER_TEMP/r6h-live"
      - name: Preserve complete or partial receipts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ksgt-r6h-scope-writer-receipts
          retention-days: 7
          if-no-files-found: warn
          path: |
            ${{ runner.temp }}/r6h-preflight.json
            ${{ runner.temp }}/r6h-live/
