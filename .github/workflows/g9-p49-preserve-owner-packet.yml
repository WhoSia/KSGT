name: G9-P49 Preserve Owner Repair Packet

on:
  push:
    paths:
      - ".github/workflows/g9-p49-preserve-owner-packet.yml"
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  preserve:
    runs-on: ubuntu-latest
    steps:
      - name: Download canonical owner packet artifact
        uses: actions/download-artifact@v4
        with:
          name: g9-p49-owner-repair-working-packet
          path: p49_owner_packet
          run-id: 37550243190
          github-token: ${{ github.token }}
      - name: Re-upload exact packet with longer retention
        uses: actions/upload-artifact@v4
        with:
          name: g9-p49-owner-repair-working-packet-preserved
          path: p49_owner_packet
          if-no-files-found: error
          retention-days: 14
