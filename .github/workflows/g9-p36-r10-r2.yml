name: G9-P36-R10-R2 KSGT-ARG-v1.1 token-identity repair
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['experiments/g9-p36-r10-r2/action_trigger.txt']
permissions: {contents: read}
jobs:
  court:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Verify R2 seal
        run: grep -q 'PROSPECTIVE_ANALYSIS_AXES_SEALED_ON_ALREADY_OPENED_R1_BYTES' experiments/g9-p36-r10-r2/preseal.yaml
      - name: Build repaired Rust core
        run: cargo build --release --manifest-path experiments/g9-p36-r10-r2/arg-core-r11/Cargo.toml
      - name: Run token-identity adversarial controls
        run: |
          set -euo pipefail
          python experiments/g9-p36-r10-r2/generate_arg_v11_controls.py /tmp/r11-controls.jsonl
          experiments/g9-p36-r10-r2/arg-core-r11/target/release/ksgt_arg_r11 batch /tmp/r11-controls.jsonl /tmp/r11-receipts.jsonl
          python - <<'PY'
          import json
          xs=[json.loads(x) for x in open('/tmp/r11-receipts.jsonl') if x.strip()]
          assert len(xs)==8
          assert all(x['match_expected'] for x in xs)
          json.dump({'pass':True,'controls':len(xs),'version':'KSGT-ARG-v1.1'},open('/tmp/r11-summary.json','w'),indent=2)
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: g9-p36-r10-r2-token-identity-repair
          path: /tmp/r11-*.json*
