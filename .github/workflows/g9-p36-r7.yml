name: G9-P36-R7 relation-motif and Korean transport court
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['experiments/g9-p36-r7/action_trigger.txt']
permissions: {contents: write}
jobs:
  court:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - name: Verify presealed R7 constitution and controls
        run: |
          set -euo pipefail
          test -f experiments/g9-p36-r7/preseal.yaml
          grep -q 'PROSPECTIVE_CHARTER_SEALED_BEFORE_R7_NATURAL_SCORING' experiments/g9-p36-r7/preseal.yaml
          mkdir -p experiments/g9-p36-r7/final /tmp/r7
          node experiments/g9-p36-r7/generate_r7_controls.mjs experiments/g9-p36-r7/final/r7_controls.json | tee experiments/g9-p36-r7/controls.log
      - name: Build inherited R3 proof controls
        run: |
          set -euo pipefail
          cargo build --release --manifest-path experiments/g9-p36-r3/proof-kernel/Cargo.toml
          cp experiments/g9-p36-r3/proof-kernel/target/release/g9_p36_r3_proof_kernel /tmp/proof-kernel
          node experiments/g9-p36-r3/generate_controls.mjs /tmp/r7/r3-controls.jsonl
          /tmp/proof-kernel /tmp/r7/r3-controls.jsonl experiments/g9-p36-r7/final/r3_control_proofs.jsonl
      - name: Resolve and verify inherited Re3Align source
        run: |
          set -euo pipefail
          BASE='https://tudatalib.ulb.tu-darmstadt.de/server/api'; ITEM='8d57be09-68f3-4d47-aed4-2e555cbcc503'
          curl -fsSL -H 'Accept: application/hal+json' "$BASE/core/items/$ITEM/bundles?size=100" -o /tmp/b.json
          BUNDLE=$(jq -r '._embedded.bundles[]|select(.name=="ORIGINAL")|.uuid' /tmp/b.json|head -1)
          curl -fsSL -H 'Accept: application/hal+json' "$BASE/core/bundles/$BUNDLE/bitstreams?size=100" -o /tmp/s.json
          CONTENT=$(jq -r '._embedded.bitstreams[]|select(.name=="Re3Align_v1.0.zip")|._links.content.href' /tmp/s.json|head -1)
          curl -fL --retry 4 --retry-delay 5 "$CONTENT" -o /tmp/Re3Align.zip
          test "$(sha256sum /tmp/Re3Align.zip|awk '{print $1}')" = d400a34d8dcf557c0e49b1d140db29a34153688a7047e451bba9635c5944519b
          mkdir /tmp/re3; unzip -q /tmp/Re3Align.zip -d /tmp/re3
      - name: Execute Re3Align relation motif and lexical-null court
        run: |
          set -euo pipefail
          cp experiments/g9-p36-r2/adapter_response_chunk_v1.js /tmp/adapter.mjs
          cp experiments/g9-p36-r2/compiler_c3r2_structural.js /tmp/r2compiler.mjs
          node experiments/g9-p36-r7/extract_r7_re3align.mjs /tmp/re3 /tmp/adapter.mjs /tmp/r2compiler.mjs experiments/g9-p36-r7/final | tee experiments/g9-p36-r7/re3align.log
          rustc -O experiments/g9-p36-r7/crosscheck_r7.rs -o /tmp/r7-crosscheck
          /tmp/r7-crosscheck experiments/g9-p36-r7/final/motif_items.tsv | tee experiments/g9-p36-r7/final/rust_crosscheck.tsv
          JS_E=$(jq -r '.relation_motif.exploratory_edge_recurrence_pairs' experiments/g9-p36-r7/final/re3align_summary.json)
          JS_C=$(jq -r '.relation_motif.connected_chain_pairs_any_paper' experiments/g9-p36-r7/final/re3align_summary.json)
          JS_P=$(jq -r '.relation_motif.primary_cross_paper_connected_chain_pairs' experiments/g9-p36-r7/final/re3align_summary.json)
          RS_E=$(awk -F '\t' '$1=="exploratory_pairs"{print $2}' experiments/g9-p36-r7/final/rust_crosscheck.tsv)
          RS_C=$(awk -F '\t' '$1=="chain_pairs"{print $2}' experiments/g9-p36-r7/final/rust_crosscheck.tsv)
          RS_P=$(awk -F '\t' '$1=="primary_cross_paper_chain_pairs"{print $2}' experiments/g9-p36-r7/final/rust_crosscheck.tsv)
          test "$JS_E" = "$RS_E"; test "$JS_C" = "$RS_C"; test "$JS_P" = "$RS_P"
      - name: Execute native-Korean StyleKQC transport and sparse retrieval
        run: |
          set -euo pipefail
          python -m pip install --quiet pandas pyarrow
          python experiments/g9-p36-r7/analyze_stylekqc_r7.py experiments/g9-p36-r7/final | tee experiments/g9-p36-r7/stylekqc.log
      - name: Adjudicate R7
        run: |
          set -euo pipefail
          node experiments/g9-p36-r7/adjudicate_r7.mjs experiments/g9-p36-r7/final | tee experiments/g9-p36-r7/final-run.log
      - uses: actions/upload-artifact@v4
        with:
          name: g9-p36-r7-relation-korean-court
          path: experiments/g9-p36-r7/
      - name: Commit derived R7 artifacts
        if: always()
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add experiments/g9-p36-r7/final experiments/g9-p36-r7/*.log || true
          git commit -m 'G9-P36-R7: materialize relation-motif and Korean transport court' || exit 0
          git pull --rebase origin main
          git push origin HEAD:main
