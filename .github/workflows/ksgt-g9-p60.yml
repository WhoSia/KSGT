name: KSGT G9-P60 Source-Disjoint Revision Court
on:
  workflow_dispatch:
  push:
    paths:
      - 'experiments/g9-p60/**'
      - '.github/workflows/ksgt-g9-p60.yml'
permissions:
  contents: read
jobs:
  source-ledger-contrast:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run historical output-hash, component and two-axis regression
        run: |
          node experiments/g9-p60/revision_evaluation_v01.cjs
      - name: P1 proof-carrying revision court and contamination controls
        run: |
          node experiments/g9-p60/revision_court_v02.cjs
          node experiments/g9-p60/revision_court_v02.cjs --emit-revisions | python3 experiments/g9-p60/revision_audit_v02.py
          node experiments/g9-p60/selection_trap_v02.cjs
      - name: P2 frozen authored-source and matched revision-policy authority court
        run: |
          node experiments/g9-p60/source_claim_court_v03.cjs
          python3 experiments/g9-p60/source_archive_audit_v03.py --self-test
      - name: P2 v04 original-source claim alignment and cross-language audit
        run: |
          node experiments/g9-p60/claim_alignment_court_v04.cjs
          python3 experiments/g9-p60/private_claim_audit_v04.py --self-test
      - name: P2 v05 EX09 U2 logical countermodels and EX10 source-disjointness audit
        run: |
          python3 experiments/g9-p60/solo_claim_court_v05.py --self-test
      - name: Verify ledger invariants without requiring private P53 source archives
        run: |
          node experiments/g9-p60/revision_evaluation_v01.cjs --emit-ledger > "$RUNNER_TEMP/p60-ledger.json"
          python3 - "$RUNNER_TEMP/p60-ledger.json" <<'PY'
          import json,sys
          r=json.load(open(sys.argv[1],encoding='utf8'))
          assert r['stage']=='G9-P60'
          assert len(r['records'])==22
          assert len(r['connectedSourceWorks'])==6
          assert r['actualRevisions']==0 and r['humanPreferenceObservations']==0
          assert r['freshHoldout'] is False
          assert sum(len(x['revisionCandidateIds']) for x in r['records'])==2
          assert sum(bool(x['revisionCandidateIds']) for x in r['records'])==1
          assert r['provisionalEdits']==2
          assert all(x['nativeHumanPreference']=='NOT_OBSERVED' for x in r['records'])
          print('P60_LEDGER_CONTRACT_PASS')
          PY
