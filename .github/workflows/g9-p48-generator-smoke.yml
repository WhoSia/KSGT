name: G9-P48 Generator Smoke

on:
  push:
    paths:
      - "experiments/g9-p48/generator_smoke.py"
      - ".github/workflows/g9-p48-generator-smoke.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install frozen runtime
        run: python -m pip install "torch==2.6.0" "transformers==4.49.0" "huggingface-hub==0.29.1" "safetensors>=0.4.5"
      - name: Resolve exact revision and smoke generation
        env:
          TOKENIZERS_PARALLELISM: "false"
        run: python experiments/g9-p48/generator_smoke.py
      - uses: actions/upload-artifact@v4
        with:
          name: g9-p48-generator-smoke
          path: g9_p48_generator_smoke.json
          if-no-files-found: error
          retention-days: 30
