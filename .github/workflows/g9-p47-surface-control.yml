name: G9-P47 Surface Nuisance Control

on:
  push:
    paths:
      - ".github/workflows/g9-p47-surface-control.yml"
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  surface-control:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Download frozen P47 packet from canonical run
        uses: actions/download-artifact@v4
        with:
          name: g9-p47-okhc-public-packet
          path: p47_packet
          run-id: 37389716969
          github-token: ${{ github.token }}
      - name: Install surface runtime
        run: python -m pip install "scikit-learn==1.6.1" "numpy==2.2.3"
      - name: Run surface nuisance control
        run: |
          python experiments/g9-p47/run_surface_control.py \
            --packet p47_packet/packet.jsonl \
            --out g9_p47_surface_control.json
      - name: Upload surface control receipt
        uses: actions/upload-artifact@v4
        with:
          name: g9-p47-surface-control
          path: g9_p47_surface_control.json
          if-no-files-found: error
          retention-days: 30
