name: G9-P50 Rust Slice Verifier CI

on:
  push:
    paths:
      - "experiments/g9-p50/rust-slice-verify/**"
      - ".github/workflows/g9-p50-rust-slice-verify.yml"
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: experiments/g9-p50/rust-slice-verify
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Verify Rust compiler and tests
        run: |
          cargo test
          cargo clippy --all-targets -- -D warnings
      - name: Fetch immutable frozen token artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh run download 37712642109 --repo "${{ github.repository }}" --name g9-p50-model-training-slice --dir /tmp/g9-p50-frozen-slice
      - name: Independently audit archived token bytes
        run: cargo run --release -- /tmp/g9-p50-frozen-slice
