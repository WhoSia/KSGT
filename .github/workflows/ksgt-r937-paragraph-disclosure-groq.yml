name: KSGT R9.37 Paragraph Disclosure

on:
  push:
    branches: [research/r9-24-anchored-revision]
    paths: ['.github/workflows/ksgt-r937-paragraph-disclosure-groq.yml']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ksgt-r937-paragraph-disclosure-groq
  cancel-in-progress: false

jobs:
  paragraph-disclosure:
    if: github.actor == 'WhoSia' && github.ref == 'refs/heads/research/r9-24-anchored-revision' && github.run_attempt == 1
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify fixed alternatives and discourse transitions
        run: |
          node --test experiments/discourse-state/*.test.cjs
          node experiments/discourse-state/disclosure-pilot.cjs --plan > "$RUNNER_TEMP/r937-plan-safe.json"
      - name: Generate paired Korean prose with disclosure control
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: |
          node experiments/discourse-state/disclosure-pilot.cjs --execute "$RUNNER_TEMP/r937-run"
      - name: Archive attempt markers, response receipts and token usage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ksgt-r937-paragraph-disclosure-groq
          retention-days: 7
          if-no-files-found: error
          path: |
            ${{ runner.temp }}/r937-plan-safe.json
            ${{ runner.temp }}/r937-run/
