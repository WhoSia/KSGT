name: G9-P47 Adaptive Geometry Court

on:
  push:
    paths:
      - ".github/workflows/g9-p47-adaptive-geometry.yml"
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  prepare-fresh-holdout:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install "requests==2.32.3"
      - name: Build fresh Hwangsung holdout
        run: python experiments/g9-p47/prepare_adaptive_holdout.py --outdir p47_holdout
      - uses: actions/upload-artifact@v4
        with:
          name: g9-p47-adaptive-hwangsung-holdout
          path: |
            p47_holdout/holdout.jsonl
            p47_holdout/receipt.json
          if-no-files-found: error
          retention-days: 30

  adaptive:
    needs: prepare-fresh-holdout
    strategy:
      fail-fast: false
      matrix:
        alias: [F0, F1, F2, F3]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Download canonical development packet
        uses: actions/download-artifact@v4
        with:
          name: g9-p47-okhc-public-packet
          path: p47_dev
          run-id: 37389716969
          github-token: ${{ github.token }}
      - name: Download fresh holdout
        uses: actions/download-artifact@v4
        with:
          name: g9-p47-adaptive-hwangsung-holdout
          path: p47_holdout
      - name: Install frozen runtime
        run: |
          python -m pip install \
            "torch==2.6.0" "transformers==4.49.0" "sentence-transformers==3.4.1" \
            "scikit-learn==1.6.1" "numpy==2.2.3" "huggingface-hub==0.29.1"
      - name: Run adaptive centroid intervention
        env:
          TOKENIZERS_PARALLELISM: "false"
        run: |
          python experiments/g9-p47/run_adaptive_centroid.py \
            --alias "${{ matrix.alias }}" \
            --dev p47_dev/packet.jsonl \
            --holdout p47_holdout/holdout.jsonl \
            --out "g9_p47_adaptive_${{ matrix.alias }}.json"
      - uses: actions/upload-artifact@v4
        with:
          name: g9-p47-adaptive-${{ matrix.alias }}
          path: "g9_p47_adaptive_${{ matrix.alias }}.json"
          if-no-files-found: error
          retention-days: 30

  collect:
    needs: adaptive
    runs-on: ubuntu-latest
    steps:
      - name: Download adaptive F0
        uses: actions/download-artifact@v4
        with: {name: g9-p47-adaptive-F0, path: results}
      - name: Download adaptive F1
        uses: actions/download-artifact@v4
        with: {name: g9-p47-adaptive-F1, path: results}
      - name: Download adaptive F2
        uses: actions/download-artifact@v4
        with: {name: g9-p47-adaptive-F2, path: results}
      - name: Download adaptive F3
        uses: actions/download-artifact@v4
        with: {name: g9-p47-adaptive-F3, path: results}
      - name: Print adaptive receipts
        run: |
          for f in results/g9_p47_adaptive_*.json; do
            echo "===== $f ====="
            cat "$f"
          done
      - name: Build combined matrix
        run: |
          python - <<'PY'
          import glob,json
          out={}
          for p in sorted(glob.glob("results/g9_p47_adaptive_*.json")):
              d=json.load(open(p,encoding="utf-8")); out[d["alias"]]=d
          json.dump({"schema":"ksgt.g9.p47.adaptive-matrix.v1","models":out},
                    open("g9_p47_adaptive_matrix.json","w",encoding="utf-8"),
                    ensure_ascii=False,indent=2)
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: g9-p47-adaptive-matrix
          path: g9_p47_adaptive_matrix.json
          if-no-files-found: error
          retention-days: 30
