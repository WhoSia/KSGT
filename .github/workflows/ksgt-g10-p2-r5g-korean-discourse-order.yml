name: KSGT G10-P2 R5g Executable Korean Rhetorical Graph Writer (16 True 120B Calls)
on:
  push:
    branches: [research/g10-p2-reader-state-coupled]
    paths: [.github/workflows/ksgt-g10-p2-r5g-korean-discourse-order.yml]
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: ksgt-g10-p2-r5g-16-strong-korean-prose-20261121
  cancel-in-progress: false

jobs:
  korean-paragraphs:
    if: github.actor == 'WhoSia' && github.ref == 'refs/heads/research/g10-p2-reader-state-coupled' && github.run_attempt == 1
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      NODE_OPTIONS: --unhandled-rejections=strict
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 60
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Human-contributor-only provenance gate
        shell: bash
        run: |
          test "$(git log -1 --format='%ae')" = '71053804+WhoSia@users.noreply.github.com'
          if git log -45 --format='%an|%ae|%cn|%ce' | grep -i 'github-actions\[bot\]'; then
            echo 'BOT_CONTRIBUTOR_NOT_ALLOWED'; exit 1
          fi
      - name: Test executable DAG algorithm and historical stage integrity
        run: |
          node --test experiments/g10-p2/r5/*.test.cjs
          node --test experiments/g10-p2/*.test.cjs
      - name: Frozen fresh Korean writing source and no-call algorithm preflight
        run: |
          node experiments/g10-p2/r5/r5g_korean_discourse_order_realizer.cjs --preflight > "$RUNNER_TEMP/r5g-preflight-plan.json"
          node -e 'const x=require(process.argv[1]);if(x.works!==8||x.newCalls!==16||x.perWork.length!==8||x.perWork.some(y=>y.solution.nodeCount!==6))process.exit(1);console.log("R5g-actual-source-topologies",x.planHash,x.perWork.map(y=>y.id+":"+y.solution.validOrders).join(","))' "$RUNNER_TEMP/r5g-preflight-plan.json"
      - name: Generate real complete Korean prose from direct 120B vs executable DAG ordering 120B
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: |
          node experiments/g10-p2/r5/r5g_korean_discourse_order_realizer.cjs --execute "$RUNNER_TEMP/r5g-live"
      - name: Cold verify all 16 provider receipts and independent quality authority is not fabricated
        run: |
          node experiments/g10-p2/r5/r5g_korean_discourse_order_realizer.cjs --score "$RUNNER_TEMP/r5g-live" > "$RUNNER_TEMP/r5g-cold-recount.json"
          node -e 'const x=require(process.argv[1]);if(x.sourceWorks!==8||x.newProviderCalls!==16||x.completeKoreanTexts!==16||x.fixedGraphPlanningExtraModelCalls!==0||x.independentNativeReaders!==0||x.independentSemanticGold!==0||x.naturalnessSuperiority!=="NOT_ESTABLISHED")process.exit(1);console.log("R5g-true-Korean-complete-results",JSON.stringify(x))' "$RUNNER_TEMP/r5g-cold-recount.json"
          test "$(grep -c '^## [1-8]\.' "$RUNNER_TEMP/r5g-live/plain-Korean-16-graph-ordered-comparisons.md")" -eq 8
      - name: Archive all 16 original provider JSON and 16 complete Korean texts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ksgt-g10-p2-r5g-16-real-120b-executable-korean-order-writer
          retention-days: 7
          if-no-files-found: warn
          path: |
            ${{ runner.temp }}/r5g-preflight-plan.json
            ${{ runner.temp }}/r5g-live/
            ${{ runner.temp }}/r5g-cold-recount.json
