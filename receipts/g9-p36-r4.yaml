interpretation: >
  R4 discharged much of the R3 representation ceiling: representation-complete natural
  pairs rose from 126 to 1,205, and 1,193 of 3,238 unique candidate obligations obtained
  complete BCOG certificates. Yet after requiring inherited structural grounding, only
  180 pairs remained, and none shared the same protected semantic core. Conversely the
  three same-core pairs all crossed grounding boundaries. Thus natural fusion is not
  certified under the frozen R3 candidate geometry. The result does not show that natural
  distributed redundancy is absent; it falsifies the adequacy of the legacy candidate
  geometry for discovering it in the stronger BCOG space.

