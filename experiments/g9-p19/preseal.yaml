stage: KSGT-G9-P19
status: PRESEALED
source_stage: G9-P18
quality_contract: Q-C1
transition_contract: RTD-1
focus:
  - live_receipt_garbage_collection
  - authority_debt_expiry
  - dynamic_state_markov_sufficiency
  - reopening_after_receipt_loss
  - minimal_provenance_persistence
method_imports:
  self_adjusting_computation:
    donor: Acar_et_al_2006_and_Acar_Blume_Donham_2013
    import: dynamic_dependency_change_propagation_plus_from_scratch_consistency
  adapton:
    donor: Hammer_et_al_2014
    import: demand_driven_dirtying_and_revalidation
  nominal_adapton:
    donor: Hammer_et_al_2015
    import: stable_names_for_safe_reuse_identity_not_authority
  provenance_semirings:
    donor: Green_Karvounarakis_Tannen_2007
    import: how_provenance_over_alternative_authority_derivations
  leases:
    donor: Gray_Cheriton_1989
    import: expiry_only_when_authority_contract_contains_explicit_temporal_term
receipt_lifecycle:
  LIVE: currently appears in at least one minimal support for an enabled future authority query
  DIRTY: potentially relevant but dependency mutation requires demand-time revalidation
  DEAD: appears in no minimal support for any reachable future authority query under frozen horizon
events:
  - dependency_change
  - explicit_revocation
  - explicit_lease_expiry
  - support_subgraph_loss
  - regime_recompile
  - demand_revalidation
gc_rule:
  collect_if:
    - status_DEAD
    - no_reachable_future_authority_query_depends_on_receipt
    - deleting_receipt_preserves_authority_from_scratch_consistency
authority_from_scratch_consistency:
  compare_against: full_history_recomputation
  observables:
    - legal_successor_set
    - Q3_state
    - membership_authority
    - selection_authority_state
    - transport_authorization
markov_test:
  state_candidate: current_authority_quotient_plus_live_or_dirty_receipt_frontier
  compare_histories: 9_P18_convergent_path_pairs
  future_probe_words:
    length_1: all_frozen_operators
    length_2: selected_authority_relevant_pairs
reopening:
  historical_name_match_insufficient: true
  after_receipt_loss_requires:
    - surviving_source_evidence_or_fresh_world_contact
    - local_revalidation
    - fresh_receipt_issue
provenance_representation:
  formula: positive_boolean_or_semiring_expression_over_receipt_atoms
  receipt_live_if_in_minimal_satisfying_support_of_any_reachable_authority_query: true
forbidden:
  - time_elapsed_implies_expiry_without_lease
  - name_match_implies_authority_revival
  - full_history_by_default
  - gc_of_live_or_dirty_receipt
  - Q4_inheritance
  - fifth_quality_authority
human_recruitment: false
schema_repair: 0
