explanandum:
  question: >
    What authority can KSGT legitimately have over null-vs-overt Korean realization decisions when it already has strong recoverability gold but not a paired overt/null preference experiment?
  objects:
    - RECOVERABILITY
    - OFFLINE_DOCUMENT_RECOVERABILITY
    - ONLINE_PRODUCTION_LICENSE
    - NULL_REALIZATION_LICENSE
    - NULL_VS_OVERT_PREFERENCE
    - STYLE_UTILITY
  forbidden_collapses:
    - RECOVERABLE_IMPLIES_SHOULD_OMIT
    - OFFLINE_RECOVERABLE_IMPLIES_ONLINE_LICENSED
    - TEXTUAL_ANTECEDENT_REQUIRED_FOR_ALL_OMISSION
    - SUBJECT_OR_TOPIC_STATUS_UNIQUELY_DETERMINES_NULLNESS
    - CORPUS_FREQUENCY_CREATES_SEMANTIC_AUTHORITY

identifiability_theorem:
  observed_ZA_data_condition: Z_EQUALS_NULL_FOR_ANNOTATED_SLOT
  identifies:
    - antecedent_or_contextual_recovery_structure_given_null
    - syntactic_slot_given_null
    - distance_and_edge_state_given_null
  does_not_identify:
    - probability_of_null_given_context
    - probability_of_overt_given_same_context
    - counterfactual_preference_null_vs_overt
    - stylistic_utility_of_nullness
  reason: >
    comparable overt argument opportunities under the same candidate-risk set are not observed and labeled as a paired choice set in ZA gold.

online_offline_split:
  offline_document_recoverability:
    may_use:
      - preceding_antecedent
      - following_antecedent
      - document_global_context
  online_generation_license:
    may_not_use_future_text_by_default: true
    following_antecedent_requires:
      - independently_licensed_cataphoric_or_structural_mechanism
      - no_reliance_on_future_information_unavailable_at_generation_time
  external_context:
    special_hash_or_deictic_state_can_license_contextual_recovery_without_textual_antecedent: true

state_constitution:
  version: KSGT-REALIZE-v0.1
  semantic_state:
    - EVENT_TOKEN
    - ARGUMENT_SLOT
    - REFERENT_OR_REFERENT_SET
    - SEMANTIC_ROLE_IF_AUTHORIZED
  discourse_state:
