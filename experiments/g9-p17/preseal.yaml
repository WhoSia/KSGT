stage: KSGT-G9-P17
status: PRESEALED
source_stage: G9-P16
quality_contract: Q-C1
transition_contract: RTD-1
focus:
  - attribution_graph_quotienting
  - support_bearing_subgraph_equivalence
  - graph_edit_authority_distance
  - minimal_counterexample_basis
  - cross_regime_graph_transport
quotient_equivalence:
  G_equiv_H_if:
    - same_target_invariants
    - same_Q1_Q2_Q3_outcomes
    - same_admissible_support_bearing_connected_subgraph_family_up_to_label_preserving_isomorphism
    - same_membership_authority
    - same_selection_authority_state
    - same_transport_decisions_under_frozen_edit_basis
edit_basis:
  E0: rename_noncarrier_node
  E1: delete_noncarrier_node
  E2: replace_noncritical_edge_with_semantically_equivalent_edge
  E3: delete_carrier_critical_edge
  E4: reverse_directional_relation
  E5: change_relation_type_contrast_reinforce_correct
  E6: host_regime_recompile_D_N_X
authority_distance:
  definition: minimum_number_of_authority_relevant_edits_needed_to_change_any_Q3_membership_selection_or_transport_decision
  distance_zero_requires_quotient_equivalence: true
counterexample_basis:
  goal: smallest_edit_set_separating_non_equivalent_graphs
  no_post_outcome_basis_expansion: true
cross_regime:
  regimes: [D,L,N]
  same_surface_graph_not_assumed_same_authority_state: true
  transport_requires_local_Q3: true
  Q4_never_inherits: true
minimality_competitors:
  - exact_graph_identity
  - typed_graph_isomorphism
  - support_subgraph_family_equivalence
  - authority_decision_equivalence
forbidden:
  - graph_edit_count_as_authority_distance_without_decision_change
  - unlabeled_graph_isomorphism_as_sufficient
  - quotienting_away_carrier_critical_edges
  - cross_regime_winner_inheritance
  - fifth_quality_authority
human_recruitment: false
schema_repair: 0
