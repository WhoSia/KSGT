stage: KSGT-G9-P14
status: PRESEALED
source_stage: G9-P13
quality_contract: Q-C1
transition_contract: RTD-1
focus:
  - host_embedded_regime_semantics
  - attribution_quotation_scope
  - effect_carrier_localization
  - nested_support_fibers
  - authority_preserving_embedded_voice_transport
unit_model:
  layers:
    H: host_voice
    E: embedded_attributed_voice
    M: mixed_or_distributed_carrier
  attribution_edge_required: true
carrier_states:
  - HOST
  - EMBEDDED
  - DISTRIBUTED
  - UNRESOLVED
credit_rules:
  host_support_requires_host_carrier: true
  embedded_support_does_not_upgrade_host_support: true
  quotation_presence_does_not_imply_verbatim_or_authority: true
  attribution_scope_must_be_localized: true
transport:
  embedded_voice_transport_requires:
    - source_voice_receipt
    - target_host_regime_receipt
    - attribution_scope_receipt
    - local_Q3_readjudication
    - no_selection_authority_inheritance
packet:
  targets:
    - hesitation
    - restrained_reproach
    - affectionate_teasing
    - incredulity
    - dry_irony
    - self_correction
    - softened_warning
    - resigned_humor
  forms: [host_only, direct_quote, indirect_report, free_indirect_or_mixed]
  cells: 32
forbidden:
  - quote_laundering
  - source_voice_to_host_support_laundering
  - host_naturalness_to_embedded_effect_authority
  - verbatim_presumption
  - free_indirect_forced_single_voice_assignment
  - fifth_quality_authority
human_recruitment: false
schema_repair: 0
