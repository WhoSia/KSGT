phase: KSGT Generation IX G9-P36-R10-R6
title: Comparable Overt↔Null Choice-Set Materialization, Antecedent-Available Overt Controls, Information-Structure Proxy Falsification, Native-Original Counterfactual Pair Construction, Preference-Authority Calibration & KSGT-REALIZE-v0.2 World-Choice Court
date: 2026-09-29
status: PROSPECTIVE_CHOICE_SET_AND_VARIATION_COURT_SEALED_BEFORE_R6_AGGREGATE_COMPUTATION

inherits:
  R3:
    cross_layer_graph: KSGT-XARG-v0.1
    zero_slot_semantic_role: STRUCTURALLY_UNAVAILABLE_FROM_CURRENT_EXPLICIT_GOLD
  R5:
    realization_theory: KSGT-REALIZE-v0.2
    surface_risk_set_geometry: PROMOTED
    counterfactual_utility: NOT_IDENTIFIED

explanandum:
  question: >
    Can native Korean overt and null realizations be placed into a genuinely comparable observational choice set,
    and what mathematical structure is required to model human variation without treating irregularity as either error or free random noise?
  target_objects:
    - COMPARABLE_OBSERVED_CHOICE_SET
    - ANTECEDENT_AVAILABLE_OVERT_CONTROL
    - PRE_CHOICE_INFORMATION_STRUCTURE_PROXY
    - DOCUMENT_STYLE_RANDOM_EFFECT
    - LOCAL_REALIZATION_STATE
    - OVEREXPLICITNESS
    - COUNTERFACTUAL_PAIR_PACKET

choice_set_constitution:
  target_slots: [SUBJECT, OBJECT]
  null_case:
    source: official_ZA_zero_slot
    required:
      - exact_predicate_token
      - syntactic_slot
      - generation_time_recoverability_class
  overt_case:
    source: direct_DP_dependent_of_same_predicate_token
    required:
      - dependency_label_suffix_SBJ_or_OBJ
      - stable_dependent_span_or_head
  exclude_from_binary_preference_estimation:
    - predicate_slot_with_simultaneous_overt_and_null_instances
    - unresolved_predicate_alignment
  preserve_as_separate_state:
    - BOTH
    - NONE

antecedent_available_overt_controls:
  proxy_levels:
    P0:
      name: NO_PRIOR_EVIDENCE
    P1:
      name: PRIOR_HEAD_FORM_REPEAT
      rule: overt_argument_head_form_seen_earlier_in_same_document
    P2:
      name: PRIOR_PROPER_NAME_REPEAT
      rule: exact_NNP_form_seen_earlier_in_same_document
  authority:
    P1: LEXICAL_ACCESSIBILITY_PROXY_ONLY
    P2: HIGHER_PRECISION_REFERENTIAL_ACCESSIBILITY_PROXY_NOT_COREFERENCE_GOLD
  forbidden:
    - exact_form_repeat_equals_same_referent
    - no_repeat_equals_new_referent

prechoice_proxies:
  allowed:
    - prior_mention_recency
    - prior_mention_count
    - prior_mention_subjecthood
    - source_lane
    - predicate_lemma
    - predicate_sense
    - syntactic_slot
  forbidden:
    - current_overt_topic_marker_as_prechoice_cause
    - current_case_particle_as_prechoice_cause
    - post_realization_surface_features_as_choice_causes

prospective_hypotheses:
  H1:
    claim: HIGH_ACCESSIBILITY_OVERT_CONTROLS_EXIST_IN_NONTRIVIAL_NUMBER
    threshold: P2_count_ge_1000
  H2:
    claim: ANTECEDENT_AVAILABILITY_DOES_NOT_DETERMINISTICALLY_FORCE_NULL
    witness: P2_overt_count_gt_0
  H3:
    claim: PRECHOICE_ACCESSIBILITY_PROXIES_DO_NOT_PERFECTLY_SEPARATE_NULL_AND_OVERT
    threshold: matched_strata_with_both_actions_ge_100
  H4:
    claim: DOCUMENT_LEVEL_REALIZATION_COUNTS_ARE_OVERDISPERSED_RELATIVE_TO_SINGLE_BINOMIAL_AFTER_SLOT_AND_SOURCE_LANE
    threshold: pearson_dispersion_gt_1_25_for_subject_or_object
  H5:
    claim: LOCAL_ACTION_SEQUENCE_SHOWS_STATE_DEPENDENCE_BEYOND_GLOBAL_RATE
    operational:
      compare_same_action_transition_vs_permutation_within_document: true
      permutation_count: 199
      required_direction: observed_same_action_rate_gt_permuted_mean
  H6:
    claim: POISSON_COUNT_MODEL_IS_NOT_THE_NATURAL_PRIMITIVE
    criterion: opportunity_conditioning_materially_changes_interpretation
    note: theoretical_constitution_not_distribution_goodness_test

variation_theory:
  candidate: KSGT-REALIZE-v0.3
  decomposition:
    deterministic_constraints: G0_to_G2
    discourse_state: H_t
    author_style_state: B_author
    local_persistence_state: Z_t
    realization_action: A_t
  stochastic_policy:
    form: hierarchical_partial_identification
    no_single_population_probability: true
    no_noise_for_human_likeness: true
  overexplicitness:
    definition: >
      OVERT chosen despite strong generation-time recoverability and availability of a shorter authorized realization.
    authority: DESCRIPTIVE_UNLESS_PREFERENCE_DATA_EXISTS
  human_variation:
    principle: >
      Variation is structured heterogeneity across authors, genres, discourse states and local histories,
      not a license to inject uncalibrated randomness.

counterfactual_pair_packet:
  null_original:
    surface: official_native_original_sentence
    restoration: official_ZA_restored_form
  overt_original:
    surface: official_native_original_sentence
    antecedent_availability_proxy: required
  pair_authority:
    observational_matching: ALLOWED
    true_counterfactual_preference: NOT_YET_IDENTIFIED
  future_use:
    - prospective_native_judgment
    - author_specific_preference_calibration
    - style_frontier_learning

distributional_constitution:
  primitive: CONDITIONAL_ACTION_OVER_OPPORTUNITIES
  binomial: baseline_only
  poisson: count_approximation_only_when_opportunity_rate_is_external_and_rare
  beta_binomial_or_logistic_random_effect: candidate_for_document_author_heterogeneity
  markov_or_state_space: candidate_for_local_persistence
  negative_binomial: candidate_for_aggregate_count_overdispersion_not_choice_truth

promotion_gate:
  choice_set_authority:
    requires:
      - explicit_null_and_overt_opportunity_definition
      - no_BOTH_collapse
      - no_semantic_role_laundering
  preference_authority:
    requires:
      - native_original_comparable_pair_or_prospective_choice
      - matched_or_randomized_context
    current_default: HOLD
  humanlike_variation_authority:
    requires:
      - empirical_overdispersion_or_state_dependence
      - no_unprincipled_temperature_noise

stopping_rule:
  if_H1_to_H5_support_structured_variation:
    promote: KSGT_REALIZE_v0_3_STRUCTURED_VARIATION_CONSTITUTION
  if_not:
    retain: KSGT_REALIZE_v0_2
  counterfactual_preference:
    do_not_claim_without_choice_data: true
