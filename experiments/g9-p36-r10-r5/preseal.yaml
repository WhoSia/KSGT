risk_set_definition:
  predicate_universe: union_of_annotated_predicate_tokens_available_in_source
  target_slots: [SUBJECT, OBJECT]
  overt_instance:
    condition: direct_dependency_of_predicate_with_label_suffix_SBJ_or_OBJ
  null_instance:
    condition: zero_anaphora_slot_of_matching_predicate_and_syntactic_slot
  state_per_predicate_slot:
    - OVERT_ONLY
    - NULL_ONLY
    - BOTH
    - NONE
  law: SLOT_CATEGORY_IS_NOT_A_BERNOULLI_ARGUMENT_TOKEN_IF_BOTH_STATE_EXISTS
  authority: SURFACE_SYNTACTIC_REALIZATION_ONLY
  semantic_role_authority: FORBIDDEN

prospective_2024_replication_hypotheses:
  H1:
    claim: NULL_SHARE_SUBJECT_GREATER_THAN_NULL_SHARE_OBJECT
    threshold: strict_direction_only
  H2:
    claim: BOTH_STATE_NONZERO_FOR_SUBJECT_OR_OBJECT
    threshold: count_gt_0
  H3:
    claim: MULTIPLE_PREDICATE_CONDITIONED_STRATA_CONTAIN_BOTH_NULL_AND_OVERT_REALIZATIONS
    threshold: at_least_100_strata
  H4:
    claim: ONE_GLOBAL_NULL_PROPENSITY_IS_INADEQUATE_AS_A_DETERMINISTIC_GENERATION_RULE
    operational_witness:
      - H1_pass
      - H3_pass

generation_time_recoverability:
  source: y2025_official_ZA
  discovery_state: ALREADY_ANALYZED_IN_R5
  categories:
    - PRIOR_TEXT_AVAILABLE
    - FUTURE_TEXT_REQUIRED
    - DEICTIC_SPECIAL
    - POSITION_UNRESOLVED
    - UNRESOLVED
  authority:
    PRIOR_TEXT_AVAILABLE: POSITIVE_TEXTUAL_EVIDENCE
    FUTURE_TEXT_REQUIRED: OFFLINE_RECOVERABILITY_ONLY_BY_DEFAULT
    DEICTIC_SPECIAL: CONTEXTUAL_RECOVERABILITY_REQUIRES_NON_TEXT_STATE
    POSITION_UNRESOLVED: ABSTAIN
    UNRESOLVED: ABSTAIN

mathematical_model:
  latent_argument_token: i
  action_space: [NULL, OVERT, PRONOMINAL_OR_MARKED]
  observed_state:
    X_obs:
      - predicate_token
      - predicate_lemma
      - sense_if_available
      - syntactic_slot
      - source_regime
      - dependency_geometry
      - ZA_recovery_evidence_if_null
  latent_state:
    H:
      - discourse_salience
      - referent_identity_for_overt_cases
      - information_structure
      - style_target
      - semantic_role_when_not_gold
  semantic_role_uncertainty: Gamma_i
  risk_set_object: MULTISET_OF_REALIZATION_INSTANCES_NOT_SINGLE_SLOT_BIT

partial_identification:
  observed_realization_prevalence:
    estimand: P_observed(NULL | slot,predicate,sense,source, observed_instance_universe)
    causal_preference_interpretation: FORBIDDEN
  counterfactual_utility:
    DeltaU_i: U(NULL|X_i,H_i,Gamma_i)-U(OVERT|X_i,H_i,Gamma_i)
    identified_from_current_data: false
  omission_probability_given_full_context:
    identified: false
  reason:
    - overt_cases_lack_counterfactual_recovery_annotation
    - information_structure_not_prechoice_gold
    - semantic_role_of_zero_slot_not_gold
    - ZA_sampling_selected_on_null_realization

decision_theory:
  version: KSGT-REALIZE-v0.2-CANDIDATE
  admissibility_gates:
    G0: SEMANTIC_FIDELITY
    G1: GENERATION_TIME_RECOVERABILITY
    G2: SYNTACTIC_AND_PRAGMATIC_NULL_LICENSE
    G3: DISCOURSE_INFORMATION_STRUCTURE_FIT
    G4: STYLE_REGISTER_FIT
  preference_rule:
    scalar_utility_without_user_or_world_authority: FORBIDDEN
    default: ROBUST_PARETO_ADMISSIBILITY_UNDER_Gamma
  robust_dominance:
    definition: >
      Action a robustly dominates b only if for every semantic-role state in Gamma_i and every currently admissible discourse state,
      a is no worse on all protected dimensions and strictly better on at least one.
  if_incomparable: SURFACE_ALTERNATIVE_SET_MUST_REMAIN_OPEN

predictive_ceiling_2025:
  state: DISCOVERY_ONLY
  five_fold_document_split: true
  rows_excluding_BOTH_and_NONE: 97461
  result:
    SLOT_AUC: 0.67265
    SLOT_LANE_AUC: 0.69034
    SLOT_LEMMA_SENSE_AUC: 0.81947
    SLOT_LANE_LEMMA_SENSE_AUC: 0.81641
  interpretation: >
    predicate-sense carries strong distributional information, but predictive structure does not identify omission utility or causal preference.

stopping_rule:
