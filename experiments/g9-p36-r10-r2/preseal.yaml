phase: KSGT Generation IX G9-P36-R10-R2
title: Native-Korean Argument-Recoverability Gold Adjudication, 2020↔2025 Ontology-Transition Transport, Multi-Span Antecedent Composition, Zero-Argument Distance/Type Geometry, Syntactic-Slot→Semantic-Role Non-Identifiability & KSGT-ARG-v1 World-Contact Court
date: 2026-09-28
status: PROSPECTIVE_ANALYSIS_AXES_SEALED_ON_ALREADY_OPENED_R1_BYTES
source_state:
  official_bytes_opened_in: G9-P36-R10-R1
  fresh_source_claim: FORBIDDEN
  new_analysis_axes: PROSPECTIVE_FROM_THIS_SEAL
explanandum:
  core_question: >
    Can KSGT-ARG-v1 faithfully represent the observable recoverability structure of official Korean zero-anaphora gold across the 2020 and 2025 annotation ontologies, and what authority remains unidentifiable without independent semantic-role evidence?
  not_licensed:
    - population_frequency_claims_about_all_Korean
    - temporal_language_change_from_2020_vs_2025_corpus_differences
    - semantic_role_identity_from_subject_object_adjunct_complement
    - omission_preference_or_generation_utility_from_recovery_gold
methods_selected:
  - EXPLANANDUM_LOCK
  - CROSS_LEVEL_AUTHORITY_SEPARATION
  - EPISTEMIC_RATCHET
  - ORIGIN_RETURN_EDGE
ravel_attacks_presealed:
  - corpus_composition_confounds_version_comparison
  - annotation_ontology_shift_confounds_frequency_comparison
  - multi_span_antecedents_break_single_span_recovery_models
  - syntactic_slot_labels_do_not_identify_semantic_roles
  - schema_validation_alone_is_weaker_than_observable_roundtrip_fidelity
analysis:
  transport:
    common_slot_set: [SUBJECT, OBJECT]
    strict_2020_compatible_2025_requires:
      - syntactic_slot_in_common_set
      - exactly_one_antecedent_span
      - representable_antecedent_state
      - restored_surface_not_separately_required_by_target_ontology
    report:
      - slot_coverage
      - single_span_coverage
      - strict_joint_coverage
      - information_loss_by_reason
  multi_span:
    report:
      - cardinality_distribution
      - unique_antecedent_sentence_count
      - same_sentence_span_set_rate
      - cross_sentence_span_set_rate
      - mixed_normal_special_rate
      - slot_conditioned_multi_span_rate
  distance_geometry:
    signed_bins:
      - SAME
      - PREV_1
      - PREV_2_3
      - PREV_4_10
      - PREV_GT10
      - FOLLOW_1
      - FOLLOW_2_3
      - FOLLOW_4_10
      - FOLLOW_GT10
      - EXTERNAL_OR_SPECIAL
      - UNRESOLVED
    report_by:
      - version
      - source_lane
      - syntactic_slot
    inferential_p_values: FORBIDDEN
    cross_version_measure: JENSEN_SHANNON_DIVERGENCE_DESCRIPTIVE_ONLY
  non_identifiability:
    theorem: >
      The NIKL ZA observable projection does not contain semantic-role labels; therefore distinct enriched graphs that differ only in semantic_role can map to the same observed ZA record. Dataset-internal semantic-role identification is non-injective absent an independently authorized SRL/frame source.
    countermodel_required: true
  arg_world_contact:
    normalized_observable_roundtrip_fields:
      - version
      - document_id
      - predicate_sentence_id
      - predicate_surface
      - syntactic_slot
      - restored_surface_when_present
      - antecedent_span_set
      - annotation_edge_state
    promotion_gate:
      normalized_roundtrip_rate: 1.0
      edge_state_preservation_rate: 1.0
      rust_validation_rate: 1.0
    if_pass: PROMOTE_NIKL_ZA_OBSERVABLE_BINDING_AUTHORITY
    semantic_role_authority: NEVER_FROM_THIS_GATE
authority_ceiling:
  maximum: NIKL_ZA_OBSERVABLE_RECOVERABILITY_AUTHORITY
  semantic_role: NOT_IDENTIFIABLE_FROM_ZA_ALONE
  omission_preference: NOT_IDENTIFIABLE_FROM_RECOVERY_GOLD_ALONE
origin_return:
  milestone: CORE
  return_edge: >
    Replace retired English relation-motif authority with native Korean world-contact only if the graph earns faithful gold binding; otherwise repair or shrink KSGT-ARG-v1.
  debt: CLEAR_IF_COURT_CLOSES
